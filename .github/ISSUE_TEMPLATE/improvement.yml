name: Melhoria do protótipo
description: Propor uma alteração com objetivo e critério de aceite
body:
  - type: textarea
    id: goal
    attributes:
      label: Objetivo
      description: Qual problema esta mudança resolve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      description: Descreva o comportamento esperado e como conferir.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Referência visual ou contexto
      description: Link do Figma, captura ou rota afetada.
